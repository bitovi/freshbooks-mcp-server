# Persistent volume for the file-backed session store (src/session-store.ts),
# which writes OAuth/session tokens to ~/.freshbooks-mcp/sessions.json.
# Without this, that path lives on the pod's ephemeral filesystem and is
# wiped on every restart/reschedule (Copilot review finding on PR #16) --
# a behavior change vs. the old EC2 deploy's persistent disk. Mounted into
# the Deployment via deploy/values.yaml's extraVolumes/extraVolumeMounts
# (both already supported by charts/container-workload -- no chart change
# needed) and referenced as a 4th source on the Argo CD Application
# (bitovi-platform-services/gitops/apps/freshbooks-mcp-server.yaml).
#
# ReadWriteOnce is fine: this app runs replicaCount: 1 with autoscaling
# disabled (the session store's own docstring says "single-instance only").
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: freshbooks-mcp-server-sessions
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: gp3
  resources:
    requests:
      storage: 1Gi
