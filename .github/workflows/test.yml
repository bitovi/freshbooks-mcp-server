# Container app PR test workflow — canonical copy.
# Same test gate the release (deploy.yml) runs on vX.Y.Z tags.

name: Test

on:
  pull_request:
    branches: [main]
    # Don't burn CI on the release write-back commit (which only touches the
    # image tag) if it ever lands via PR; direct bot pushes are already
    # excluded by the [skip ci] commit message.
    paths-ignore:
      - 'deploy/values.yaml'

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Adjust node-version to match your Dockerfile's runtime version.
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
